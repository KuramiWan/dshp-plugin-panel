# test profile 的 cordis.patch.yml（DSH watchUserPatches 监听此文件）
# 复制到 ~/.dsh/profiles/test/cordis.patch.yml 后生效。
#
# 包含：
# 1) dshp-test-plugin 热插拔行（test-plugin/cordis.patch.yml 也声明了，
#    这里是冗余声明；DSH 的 bundlePatches 已从 npm 包读入，这里只作示例 —
#    实际注入请用 `dsh plugin add dshp-test-plugin`）。
# 2) test-mcp-stdio 桥接行（MCP 段管理）：mcp-client 包，stdio 走故意不存在的二进制，
#    让面板"检查"返回明确错误（验证错误回执路径）。
#    面板插件段不把 mcp 行当 patch 行管理（M3 修复）；MCP 段「加入管理」= select
#    （从 profile patch 移到白名单）、「取消管理」= removeTemplate（恢复回 profile
#    patch，M7 修复）——select/removeTemplate 的 disable/restore 同时处理 home +
#    profile patch。
- insert:
    # 热插拔：test-plugin（也可通过 `dsh plugin add` 注入；此处显式声明便于一次性 setup）
    - id: dshp-test-plugin
      name: dshp-test-plugin

    # MCP 桥接：stdio 故意指向不存在二进制
    - id: test-mcp-stdio
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: test-mcp-stdio
        transport: stdio
        command: __nonexistent_fixture_server__
        args: []
